[workspace]
resolver = "2"
members = ["crates/api", "crates/core", "crates/cli", "crates/sandbox-ish", "crates/ffi", "crates/uniffi-bindgen", "crates/guest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
solos-api = { path = "crates/api" }
solos-core = { path = "crates/core" }

async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uniffi = "0.32.1"
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# The guest CLI is carried inside the app: small beats fast for it.
[profile.release.package.solos-guest]
opt-level = "s"
strip = true
